# Local development database. Credentials match .env.example.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blood_donations
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U username -d blood_donations']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
